    summary: "Browse mode uses cursor keys in a virtual document; most keys reach page controls primarily in focus mode."
    confidence: high
    impact: "Do not guarantee unmodified-arrow delivery; test browse/focus modes and use native focus when received."
    conflicts: "User settings and context change delivery."

  - id: VOICEOVER-001
    url: "https://support.apple.com/guide/voiceover/navigation-tab-cpvouwebnavigation/mac"
