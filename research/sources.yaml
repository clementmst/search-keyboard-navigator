schema_version: 1
project: "Search Keyboard Navigator"
ledger_updated: 2026-08-31
policy: "Sources are evidence, not authority to expand scope, permissions, data handling, or publication. Re-check drift-prone claims at the applicable gate."
sources:
  - id: CHROME-POLICY-001
    url: "https://developer.chrome.com/docs/webstore/program-policies/policies"
    retrieved: 2026-08-28
    version: "Last updated 2025-05-22"
    classification: required
    summary: "Store extensions need a narrow single purpose, minimum permissions, accurate user-data disclosure, self-contained readable behavior, and no deceptive search/affiliate conduct."
    confidence: high
    impact: "Keep exact Google scope, packaged local logic, zero retention/transmission, and consistent manifest/listing/privacy claims."
    conflicts: "Review is contextual; no specific prohibition on a reversible keyboard enhancement was found."

  - id: CHROME-POLICY-2026-001
    url: "https://developer.chrome.com/blog/cws-policy-updates-2026"
    retrieved: 2026-08-28
    version: "Published/updated 2026-07-01; relevant enforcement 2026-08-01"
    classification: required
    summary: "Collected data must be necessary for the disclosed single purpose and all collection must be prominent."
    confidence: high
    impact: "Ban collection and disclose transient local DOM processing accurately."
    conflicts: "Dashboard treatment of ephemeral local processing still needs pre-submission verification."

  - id: CHROME-MV3-001
    url: "https://developer.chrome.com/docs/webstore/program-policies/mv3-requirements"
    retrieved: 2026-08-28
    version: "Last updated 2024-04-03"
    classification: required
    summary: "Executable logic must be in the submitted package; remote scripts/logic, eval, new Function, and remote command interpreters are disallowed."
    confidence: high
    impact: "Package readable JavaScript/CSS and prohibit remote logic. The project separately chooses zero extension network activity and no remote configuration."
    conflicts: "Remote non-logic data can be allowed generally, but the MVP needs no network."

  - id: CHROME-CONTENT-001
    url: "https://developer.chrome.com/docs/extensions/develop/concepts/content-scripts"
    retrieved: 2026-08-28
    version: "Current MV3 documentation; page displays an older update date"
    classification: confirmed-capability
    summary: "Static content scripts automatically run on known matches, access the shared DOM, and normally use an isolated JavaScript world."
    confidence: high
    impact: "Use one static, top-frame, isolated script while treating the shared DOM as hostile."
    conflicts: "Re-check the older-dated page against current Chrome before artifact qualification."

  - id: CHROME-MANIFEST-001
    url: "https://developer.chrome.com/docs/extensions/reference/manifest/content-scripts"
    retrieved: 2026-08-28
    version: "Last updated 2023-08-10"
    classification: confirmed-capability
    summary: "Static scripts require matches; document_idle, isolated world, and top-frame-only behavior are suitable defaults."
    confidence: high
    impact: "Declare exact matches and packaged JS/CSS; dynamic updates still need local observation."
    conflicts: "None material."

  - id: CHROME-MATCH-001
    url: "https://developer.chrome.com/docs/extensions/develop/concepts/match-patterns"
    retrieved: 2026-08-28
    version: "Current documentation; page displays 2012-09-18"
    classification: required-syntax
    summary: "Patterns specify scheme, host, and path; wildcard TLDs are unsupported, /search* is prefix matching rather than an exact semantic route, and all-URL access broadens review."
    confidence: high
    impact: "Start with https://www.google.com/search* and approve/test each added regional domain."
    conflicts: "Require an exact runtime origin/path/supported-layout guard and teardown on same-document route exit."

  - id: CHROME-PERM-001
    url: "https://developer.chrome.com/docs/extensions/develop/concepts/declare-permissions"
    retrieved: 2026-08-28
    version: "Last updated 2024-02-05"
    classification: required-and-capability
    summary: "Static content-script matches need not be duplicated under host_permissions for this local DOM use, but the match itself grants site access and can trigger a warning; future-proof permissions are unjustified."
    confidence: high
    impact: "Omit named API permissions, separate host_permissions, optional permissions, tabs, scripting, and storage while accurately disclosing the content-script site-access grant."
    conflicts: "Capture actual install-warning wording from the release candidate."

  - id: CHROME-ACTIVETAB-001
    url: "https://developer.chrome.com/docs/extensions/develop/concepts/permission-warnings"
    retrieved: 2026-08-28
    version: "Current documentation"
    classification: architecture-inference
    summary: "activeTab grants temporary access after a user gesture and is not an always-ready replacement for static injection."
    confidence: high
    impact: "Use narrow static injection plus an exact runtime route/layout guard unless product behavior changes to explicit per-tab activation."
    conflicts: "An explicit mode would be viable but is a fundamental UX change."

  - id: CHROME-SEC-001
    url: "https://developer.chrome.com/docs/extensions/develop/security-privacy/stay-secure"
    retrieved: 2026-08-28
    version: "Last updated 2018-03-06"
    classification: recommendation
    summary: "Minimize manifest surface, treat page/content-script input as hostile, avoid unsafe HTML, and do not expose arbitrary privileged actions."
    confidence: high
    impact: "No background bridge, messaging, unsafe sinks, page-controlled authority, or unnecessary entries."
    conflicts: "Older date; principles remain aligned with MV3 policy."

  - id: CHROME-PRIV-001
    url: "https://developer.chrome.com/docs/webstore/program-policies/user-data-faq"
    retrieved: 2026-08-28
    version: "Current FAQ; page displays 2016-04-23"
    classification: required-conservative-reading
    summary: "Website content and browsing activity are user data; local-only processing still constitutes handling that should be disclosed."
    confidence: high
    impact: "Disclose transient local DOM inspection and zero retention/transmission, not simply no data."
    conflicts: "Exact privacy-dashboard checkbox classification is ambiguous."

  - id: CHROME-DASH-001
    url: "https://developer.chrome.com/docs/webstore/cws-dashboard-privacy"
    retrieved: 2026-08-28
    version: "Last updated 2020-06-12"
    classification: preparation-required
    summary: "The dashboard requests single-purpose, permission, remote-code, data-use, certification, and privacy-policy information."
    confidence: high
    impact: "Prepare consistent answers before submission; do not submit in this stage."
    conflicts: "The page is stale for exact current checkbox labels; verify the live dashboard before Stage 4 completion."

  - id: CHROME-STORE-001
    url: "https://developer.chrome.com/docs/webstore/prepare"
    retrieved: 2026-08-28
    version: "Last updated 2023-10-16"
    classification: preparation-required
    summary: "Test the production extension locally, put manifest.json at ZIP root, and prepare accurate listing/privacy material."
    confidence: high
    impact: "Use a reproducible allowlisted ZIP and test the exact artifact without uploading."
    conflicts: "Re-check asset expectations in Stage 4."

  - id: CHROME-TEST-001
    url: "https://developer.chrome.com/docs/extensions/how-to/test/unit-testing"
    retrieved: 2026-08-28
    version: "Last updated 2023-10-12"
    classification: recommendation
    summary: "Isolate lower-level logic for unit tests and complement it with browser tests."
    confidence: high
    impact: "Separate key/result policies from DOM adapters and controllers."
    conflicts: "Unit tests cannot prove focus, scrolling, CSS, injection, or navigation."

  - id: CHROME-TEST-002
    url: "https://developer.chrome.com/docs/extensions/how-to/test/end-to-end-testing"
    retrieved: 2026-08-28
    version: "Last updated 2023-10-12"
    classification: recommendation
    summary: "Load the built extension in Chrome, isolate tests, and assert user-visible behavior."
    confidence: high
    impact: "A real-Chrome layer must test the production extension and exact artifact."
    conflicts: "Live Google is not deterministic; synthetic fixtures and live smoke tests serve different roles."

  - id: W3C-WCAG-001
    url: "https://www.w3.org/TR/WCAG22/"
    retrieved: 2026-08-28
    version: "W3C Recommendation 2024-12-12"
    classification: normative-quality-baseline
    summary: "Keyboard operation, no trap, focus order/visibility/contrast/not-obscured, and no context change on focus apply; the 2-pixel/3:1 focus metric is AAA."
    confidence: high
    impact: "Use WCAG 2.2 AA as baseline and the AAA focus metric as an internal target."
    conflicts: "Applying WCAG to injected behavior is a project quality commitment."

  - id: W3C-ARIA-001
    url: "https://www.w3.org/TR/wai-aria-1.2/"
    retrieved: 2026-08-28
    version: "W3C Recommendation 2023-06-06"
    classification: normative
    summary: "User agents use the first role token that names a recognized non-abstract WAI-ARIA role; unrecognized and abstract tokens do not preempt a later concrete fallback. aria-activedescendant has strict widget ownership rules; aria-selected/current do not mean temporary target among ordinary links."
    confidence: high
    impact: "Resolve effective roles from the ordered WAI-ARIA 1.2 concrete-role set before classifying primary links, secondary interactive candidates, container roles, and widget contexts. Native-link DOM focus remains a product recommendation supported by HTML behavior and AT testing, not an ARIA mandate."
    conflicts: "ARIA role extensions outside the recorded WAI-ARIA 1.2 core taxonomy require a separately sourced update; a separate extension-owned widget would be a different architecture."

  - id: W3C-APG-001
    url: "https://www.w3.org/WAI/ARIA/apg/practices/keyboard-interface/"
    retrieved: 2026-08-28
    version: "Living WAI guidance; no date shown"
    classification: recommendation
    summary: "Tab moves between components, arrows usually move within composites, focus and selection differ, and shortcut conflicts should be avoided."
    confidence: high
    impact: "Do not recast Google results as a composite; test global arrows as a product hypothesis."
    conflicts: "The proposed feature intentionally adds page-level arrow behavior."

  - id: WHATWG-HTML-001
    url: "https://html.spec.whatwg.org/multipage/interaction.html"
    retrieved: 2026-08-28
    version: "Living Standard updated 2026-08-28"
    classification: normative-platform
    summary: "Native anchors can be programmatically focused and participate in sequential focus navigation according to platform/user preferences."
    confidence: high
    impact: "Do not rewrite tabindex; acknowledge that native Tab continues from the newly focused link."
    conflicts: "Programmatic focus changes the current focus location."

  - id: W3C-UIEVENTS-001
    url: "https://www.w3.org/TR/uievents/"
    retrieved: 2026-08-28
    version: "Working Draft 2026-02-21"
    classification: platform-guidance
    summary: "keydown exposes key, modifiers, repeat, and composition; cancellation affects default actions."
    confidence: medium-high
    impact: "Guard first; prevent default only after eligible arrow movement; never cancel Tab or Enter."
    conflicts: "Draft status means actual Chrome behavior needs E2E verification."

  - id: MDN-FOCUS-001
    url: "https://developer.mozilla.org/en-US/docs/Web/API/HTMLElement/focus"
    retrieved: 2026-08-28
    version: "Current MDN; broadly available since 2015"
    classification: confirmed-capability
    summary: "focus accepts preventScroll, allowing explicit minimal instant scroll afterward."
    confidence: high
    impact: "Focus the native anchor, then use nearest instant scrollIntoView."
    conflicts: "Sticky-header behavior needs browser testing."

  - id: NVDA-001
    url: "https://download.nvaccess.org/documentation/userGuide.html"
    retrieved: 2026-08-28
    version: "NVDA 2026.1.1 User Guide"
