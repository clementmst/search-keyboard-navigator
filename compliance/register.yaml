schema_version: 1
project: "ArrowKey Search Navigator (formerly Search Keyboard Navigator)"
assessment_version: "2026-09-10-version-0.1.2-local-consent-gate"
assessed: 2026-09-10
status: "0.1.1-public-0.1.2-update-pending-exact-review"
disclaimer: "Engineering governance only; not legal advice or legal-compliance certification."
user_facts_recorded: 2026-08-28
user_supplied_facts:
  publisher: "Individual publishing personally; resident and legally established in France; states authority to accept agreements."
  distribution: "Version 0.1.1 is publicly listed in the Chrome Web Store; version 0.1.2 is a local consent-corrected rename and discovery-update candidate awaiting human validation."
  markets: "Worldwide public availability intended immediately after readiness/compliance review."
  audience: "General public; not specifically directed at children under 16."
  v1_data: "Optional privacy-minimized first-party analytics selected as a deferred future direction; current Stage 1B private-test build remains local-only/backend-free because no collection design or authorization exists."
  business_model: "Ideally free and cash-neutral; donations desired; data sales and affiliates mentioned but not approved."
  branding: "Google/Chrome compatibility references in marketing only; not in product name."
  open_source: "Use/adapt only when exact license permits and all obligations are met; otherwise independent implementation without copying."
  support: "User created searchkeyboardnavigator.support@gmail.com as the public support/privacy address and confirmed forwarding plus send-as replies through the user's personal Gmail. No fixed automatic deletion schedule is configured; the privacy policy discloses the current support purpose, forwarding, access, sensitive-information warning, and deletion approach. Future agent assistance remains deferred; no agent mailbox access, outbound automation, or unsupervised external send is authorized."
  counsel: "No external counsel planned; AI compliance reviewer is not licensed counsel and cannot certify compliance."
statuses:
  - satisfied
  - not-applicable
  - unresolved
  - legal-review-required
entries:
  - id: CWS-POLICY
    area: "Chrome Web Store Program Policies"
    jurisdiction: "Chrome Web Store distribution"
    source_ids: "CHROME-POLICY-001, CHROME-POLICY-2026-001, CHROME-MV3-001, CHROME-PRIV-001, CHROME-DISCLOSURE-001, CHROME-LIMITED-USE-001, CHROME-STORE-SERVICE-ACCOUNT-001, CHROME-STORE-UPLOAD-V2-001, CHROME-STORE-STATUS-V2-001, CHROME-STORE-PUBLISH-V2-001"
    reviewed: 2026-09-10
    status: unresolved
    applicability: "Likely required if the extension is submitted or published through the Chrome Web Store."
    reasoning: "Single purpose, minimum permissions, listing accuracy, user-data disclosures, Limited Use, deceptive behavior, security, and remote-code requirements must match the exact release artifact."
    evidence: "Version 0.1.1 was submitted and published by the user. Version 0.1.2 is narrow, local-only, dependency-free, and unsubmitted. Its popup now presents the page-data disclosure and requires an explicit Enable action; the content controller stays inert until the exact versioned local consent Boolean is true and removes its listeners on Disable. The only named API permission is storage for that Boolean."
    unresolved: "Complete independent frozen-tree review, then human Chrome consent/revocation testing and dashboard/hosted-policy/screenshot readback against the exact rebuilt artifact."

  - id: CWS-AGREEMENT
    area: "Chrome Web Store Developer Agreement"
    jurisdiction: "Chrome Web Store publisher relationship"
    source_ids: "CHROME-AGREEMENT-001"
    reviewed: 2026-09-10
    status: unresolved
    applicability: "Applies if an authorized publisher uses the Chrome Web Store developer service."
    reasoning: "The agreement incorporates other Google terms and identifies contracting arrangements by residence; only an authorized human/entity may accept it."
    evidence: "User identifies as an individual publisher resident/established in France, states authority to accept, and reports completing the account/agreement/submission steps for public version 0.1.1. No agent has interactive dashboard access or accepted terms; a publisher-linked service account now has bounded API item-management authority and was used for one read-only status check."
    unresolved: "Recheck the current agreement and dashboard requirements before any future submission where terms or publisher facts changed."

  - id: GOOGLE-TERMS
    area: "Google Terms and Search interaction"
    jurisdiction: "Use of Google Search and related services"
    source_ids: "GOOGLE-TOS-001, GOOGLE-SERVICE-TERMS-001, GOOGLE-ROBOTS-001, GOOGLE-SPAM-001"
    reviewed: 2026-09-10
    status: legal-review-required
    applicability: "Google Terms apply to service use; Search-specific applicability to an extension that changes local focus behavior must be confirmed for the intended release."
    reasoning: "Current behavior is human-initiated local DOM focus, not a query bot, but the 2026 Terms prohibit automated access contrary to machine-readable instructions and the live robots.txt disallows /search; official text does not expressly resolve this extension pattern."
    evidence: "No extension network request, scraping store, query automation, content copying, or provider replacement exists in the current tree."
    unresolved: "Authoritative clarification or qualified advice on the Terms/robots.txt interaction, plus developer/user jurisdiction, intended scale, and distribution."

  - id: GOOGLE-BRAND-IP
    area: "Google branding, intellectual property, and third-party result content"
    jurisdiction: "Trademark, copyright, and listing assets"
    source_ids: "GOOGLE-BRAND-001, GOOGLE-SEARCH-BRAND-001, GOOGLE-TOS-001"
    reviewed: 2026-09-10
    status: unresolved
    applicability: "Original project icons and an abstract promotional tile exist. The listing uses plain-text compatibility references, and three user-supplied Google Search screenshot candidates are preserved locally."
    reasoning: "The name and original assets contain no Google mark or interface imitation. Compatibility wording is non-affiliative, but a live screenshot can contain Google interface and third-party result content requiring separate rights and privacy review."
    evidence: "Asset provenance, listing draft, generated icon/promo inventory, screenshot sources/derivatives, and official Search screenshot guidance. The preferred neutral humorous candidate resolves the political-query concern."
    unresolved: "Preferred candidate still needs manageable rights for depicted Wikipedia and Dictionary.com material, approved Google attribution placement/brand treatment, final dashboard rendering, publisher display name, and any required permission."

  - id: EU-GDPR
    area: "GDPR"
    jurisdiction: "EU/EEA personal-data processing"
    source_ids: "EU-GDPR-001, CNIL-TRANSPARENCY-001"
    reviewed: 2026-08-28
    status: legal-review-required
    applicability: "Potentially applicable if the developer is established in the EU/EEA or offers services to or monitors people there."
    reasoning: "The runtime keeps Search-page processing on-device and does not expose it to the developer. Voluntary support email separately sends personal data to the France-based individual publisher and Gmail, creating concrete controller-transparency questions."
    evidence: "Current runtime has no retention, transmission, analytics, account, or backend. Support email may contain the sender address, message, timestamps, and attachments and may be forwarded between Gmail inboxes controlled by the same developer."
    unresolved: "Provide the public controller identity/contact and confirm the support purpose/legal basis, retention period or criteria, recipients/processors, applicable rights, and CNIL complaint wording; future telemetry remains a separate full privacy gate."

  - id: EU-EPRIVACY
    area: "ePrivacy and terminal-equipment rules"
    jurisdiction: "EU/EEA Member State implementations"
    source_ids: "EU-EPRIVACY-001"
    reviewed: 2026-08-28
    status: legal-review-required
    applicability: "EDPB guidance indicates purely local use is not gaining access while information stays on-device, but installation/state and Member State implementation remain contextual."
    reasoning: "No cookie, tracking, page-data storage, or transmission exists. One versioned local Boolean persists the user's enable/disable choice; extension installation, that preference, and essential transient memory may still require a necessity/exemption assessment."
    evidence: "Current source has no cookie or page-data storage, telemetry, or extension network activity. It persists only one versioned local consent Boolean."
    unresolved: "Markets, Member State law, installation/request model, scope of terminal-equipment access, and necessity/consent analysis."

  - id: EU-PROVIDER-GPSR
    area: "EU provider identity and general product safety"
    jurisdiction: "EU public distribution"
    source_ids: "EU-ECOMMERCE-001, EU-GPSR-001"
    reviewed: 2026-08-28
    status: legal-review-required
    applicability: "Potentially applicable if the extension is an economic information-society service or consumer software made available through commercial activity in the EU."
    reasoning: "Free distribution does not by itself settle economic or product status; possible duties include provider identity/contact, risk analysis, technical documentation, incident/corrective-action handling, and an EU economic operator."
    evidence: "The publisher is an individual resident/established in France and worldwide availability is intended, but no contact plan, technical release file, economic-role analysis, or incident process exists."
    unresolved: "Economic role and commercial activity, product classification, responsible economic operator if required, contact/address plan, technical documentation, incident process, and qualified EU advice."

  - id: ACCESSIBILITY-LAW
    area: "Accessibility obligations and claims"
    jurisdiction: "Market/entity/use-context dependent"
    source_ids: "W3C-WCAG-001, EU-EAA-001, US-ADA-001"
    reviewed: 2026-08-28
    status: legal-review-required
    applicability: "Depends on developer/entity, product or service category, market, public-accommodation/public-sector relationship, and target users."
    reasoning: "WCAG 2.2 is the project quality baseline, not a blanket statement of legal compliance; the experimental arrow model still needs manual assistive-technology evidence."
    evidence: "Static accessibility controls exist; real assistive-technology, visual, AX, and key-delivery validation are explicitly not claimed."
    unresolved: "Entity, markets, service category, regulated contexts, legal standard, and substantiated listing language."

  - id: CONSUMER-CLAIMS
    area: "Consumer protection and marketing claims"
    jurisdiction: "Launch-market dependent"
    source_ids: "US-FTC-CLAIMS-001, EU-UCPD-001"
    reviewed: 2026-08-28
    status: unresolved
    applicability: "Likely applies to promotional representations in markets where the extension is offered, including free offerings where relevant."
    reasoning: "Objective and implied accessibility, privacy, compatibility, performance, and exclusion claims must be truthful, evidence-based, and appropriately qualified."
    evidence: "Version 0.1.1 is public. The consent-corrected 0.1.2 listing and website qualify platform, layout, native-shortcut, privacy, and screen-reader claims; 84 Node assertions across 12 files and 3 direct PowerShell release checks pass, while new browser, deployed-site, and assistive-technology validation is not claimed."
    unresolved: "Reconcile the exact 0.1.2 listing, hosted privacy-name update, dashboard fields, screenshots, and deployed website before their external release."

  - id: OSS-LICENSES
    area: "Open-source licenses and notices"
    jurisdiction: "Artifact and source distribution"
    source_ids: "None; repository provenance observation"
    reviewed: 2026-08-28
    status: not-applicable
    applicability: "No third-party dependency or copied code is identified in the current tree; required again for every release artifact or dependency change."
    reasoning: "Current dependency-free implementation does not create a known third-party notice obligation."
    evidence: "No package manifest, lockfile, vendored library, or copied-code provenance record is present."
    unresolved: "Future dependencies, copied snippets, build tools, fonts, icons, and required notices."

  - id: GITHUB-PAGES-CI
    area: "GitHub Pages deployment supply chain"
    jurisdiction: "Optional external website deployment"
    source_ids: "GITHUB-PAGES-AUTO-001"
    reviewed: 2026-09-09
    status: unresolved
    applicability: "Applies only if the user connects this repository and activates the proposed GitHub Pages workflow."
    reasoning: "The static site itself is dependency-free, but the inactive workflow references actions/checkout@v6, actions/configure-pages@v5, actions/upload-pages-artifact@v4, and actions/deploy-pages@v4 using mutable official major-version tags from GitHub's current example."
    evidence: "`.github/workflows/deploy-pages.yml` grants only contents:read, pages:write, and id-token:write and deploys only `website/`. The public GitHub remote now exists, but the website workflow has not been activated or deployed from `main`."
    unresolved: "Before activation, recheck action versions and licenses, choose immutable reviewed commit pins or explicitly accept the official-tag update model, verify the canonical URL, enable Pages, and review the first deployment result."

  - id: THIRD-PARTY-ASSETS-DATA
    area: "Third-party assets, fixtures, screenshots, and data rights"
    jurisdiction: "Copyright, trademark, contract, and privacy"
    source_ids: "GOOGLE-BRAND-001, GOOGLE-SEARCH-BRAND-001, GOOGLE-TOS-001"
    reviewed: 2026-08-31
    status: unresolved
    applicability: "Current fixtures are deliberately synthetic and generated branding is original. Three user-supplied actual-experience Google Search screenshots are now proposed as Store listing assets."
    reasoning: "A Store listing and release package must not assume that public visibility grants reuse rights."
    evidence: "Source captures, 1280x800 derived files, deterministic crop record, and user authorization are preserved. No account identity is visibly included. The preferred neutral humorous candidate replaces the political candidate for consideration; official Search guidance still requires third-party approvals plus Google attribution."
    unresolved: "Resolve rights for depicted Wikipedia and Dictionary.com material, Google attribution placement/brand treatment, dashboard rendering, and any required permission or notice."

  - id: TELEMETRY-MONETIZATION
    area: "Telemetry, advertising, sale/sharing, payment, and monetization"
    jurisdiction: "Platform and market dependent"
    source_ids: "CHROME-POLICY-001, CHROME-PRIV-001, CHROME-LIMITED-USE-001, CHROME-AFFILIATE-001, CHROME-PAYMENT-001"
    reviewed: 2026-08-28
    status: not-applicable
    applicability: "No such feature exists or is authorized. User interest in donations and possible improvement data does not authorize implementation; data sale and affiliate rewriting/injection are blocked project defaults."
    reasoning: "Keep v1 local-only/backend-free; never sell browsing/search/user data; require a separate opt-in privacy design for telemetry and a separate provider/platform/tax review for an optional external donation link."
    evidence: "Manifest/source/static boundary checks."
    unresolved: "Future first-party telemetry still needs a complete separately authorized design; donation is post-live and needs provider/payment/tax jurisdiction review; neither data nor payment implementation is authorized."
