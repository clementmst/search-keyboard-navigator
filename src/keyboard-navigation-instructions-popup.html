<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>How to use ArrowKey Search Navigator</title>
    <link rel="stylesheet" href="keyboard-navigation-instructions-popup.css">
  </head>
  <body>
    <main>
      <header>
        <img src="../assets/icons/icon48.png" width="44" height="44" alt="">
        <div>
          <h1>Keyboard navigation</h1>
          <p>Use these keys on Google Search</p>
        </div>
      </header>

      <table aria-label="Search result keyboard controls">
        <tbody>
          <tr>
            <th scope="row"><kbd>↑</kbd></th>
            <td>Previous result</td>
          </tr>
          <tr>
            <th scope="row"><kbd>↓</kbd></th>
            <td>Next result</td>
          </tr>
          <tr>
            <th scope="row"><kbd>Enter</kbd></th>
            <td>Open result</td>
          </tr>
          <tr>
            <th scope="row">
              <span class="key-combination"><kbd>Ctrl</kbd><span aria-hidden="true">+</span><kbd>Enter</kbd></span>
            </th>
            <td>New tab where supported</td>
          </tr>
          <tr>
            <th scope="row"><kbd>Esc</kbd></th>
            <td>Clear selection</td>
          </tr>
        </tbody>
      </table>
    </main>
  </body>
</html>
